name: MongoDB backend

on:
  push:
  pull_request:

jobs:
  mongo-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: deez
      - uses: actions/checkout@v4
        with:
          repository: chrisbirster/bongo
          ref: 1c7bdf9eb5b1c63236a432333a6b26d51d1a4ae5
          path: bongo-fixture
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Start MongoDB replica set
        run: bash ./bongo-fixture/scripts/start-replica-db.sh
      - name: Start standalone MongoDB fixture
        run: |
          docker rm -f mongodb >/dev/null 2>&1 || true
          bash ./bongo-fixture/scripts/start-db.sh
          for attempt in $(seq 1 60); do
            if docker exec mongodb mongosh --quiet --username admin --password secretpassword --authenticationDatabase admin --eval 'quit(db.runCommand({ping:1}).ok === 1 ? 0 : 1)' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs mongodb >&2 || true
          exit 1
      - name: Start TLS MongoDB fixture
        run: bash ./bongo-fixture/scripts/start-tls-db.sh
      - name: Test MongoStore against pinned Bongo 0.6.0 package
        working-directory: deez
        run: zig build mongo-integration-test
      - name: Verify MongoStore indexes
        run: |
          docker exec mongodb-rs mongosh --quiet --eval '
            const target = db.getSiblingDB("deez_integration");
            const cardIndexes = target.cards.getIndexes().map((index) => index.name);
            const reviewIndexes = target.reviews.getIndexes().map((index) => index.name);
            if (!cardIndexes.includes("deck_due_id")) quit(1);
            if (!reviewIndexes.includes("card_history")) quit(1);
          '
      - name: Test terminal Mongo backup and restore
        working-directory: deez
        env:
          DEEZ_STORAGE: mongodb
        run: |
          zig build
          export DEEZ_MONGO_URI='mongodb://localhost:27019/deez_cli_backup?replicaSet=rs0'
          ./zig-out/bin/deez deck add backup-smoke
          ./zig-out/bin/deez card add 1 question answer
          ./zig-out/bin/deez backup >/tmp/deez.backup
          ./zig-out/bin/deez restore --dry-run </tmp/deez.backup | tee /tmp/deez-dry-run.txt
          export DEEZ_MONGO_URI='mongodb://localhost:27019/deez_cli_restore?replicaSet=rs0'
          ./zig-out/bin/deez restore --yes </tmp/deez.backup | tee /tmp/deez-restore.txt
          ./zig-out/bin/deez stats --json
      - name: Test rich-media sack through MongoDB
        working-directory: deez
        env:
          DEEZ_STORAGE: mongodb
        run: |
          set -euo pipefail
          export_home=$(mktemp -d)
          printf 'mongo-rich-media-test-bytes' > /tmp/deez-mongo-diagram.png
          media_ref=$(HOME="$export_home" ./zig-out/bin/deez media add /tmp/deez-mongo-diagram.png | head -n 1)
          media_hash=${media_ref#deez-media://sha256:}
          export DEEZ_MONGO_URI='mongodb://localhost:27019/deez_sack_export?replicaSet=rs0'
          HOME="$export_home" ./zig-out/bin/deez deck add "Mongo Rich Media"
          HOME="$export_home" ./zig-out/bin/deez note add 1 basic "Mongo image" "<img src=\"$media_ref\">"
          HOME="$export_home" ./zig-out/bin/deez sack export 1 /tmp/mongo-rich-media.sack
          import_home=$(mktemp -d)
          export DEEZ_MONGO_URI='mongodb://localhost:27019/deez_sack_import?replicaSet=rs0'
          HOME="$import_home" ./zig-out/bin/deez sack import /tmp/mongo-rich-media.sack
          test -f "$import_home/.local/share/deez/media/sha256/${media_hash:0:2}/$media_hash"
      - name: Mongo benchmark smoke
        working-directory: deez
        env:
          DEEZ_MONGO_BENCH_URI: mongodb://localhost:27019/deez_benchmark?replicaSet=rs0
        run: zig build benchmark -Doptimize=ReleaseFast
      - name: Stop MongoDB fixtures
        if: always()
        run: |
          docker rm -f mongodb-rs >/dev/null 2>&1 || true
          docker rm -f mongodb >/dev/null 2>&1 || true
          docker rm -f mongodb-tls >/dev/null 2>&1 || true
