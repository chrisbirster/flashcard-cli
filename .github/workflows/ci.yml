name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Ensure SQLite headers
        run: |
          if ! dpkg -s libsqlite3-dev >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libsqlite3-dev
          fi
      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          if ! zig fmt --check build.zig src test; then
            zig fmt build.zig src test
            echo 'zig fmt produced the following diff:'
            git --no-pager diff -- build.zig src test
            exit 1
          fi
      - name: Build
        run: zig build
      - name: Web smoke
        shell: bash
        run: |
          bash test/web_smoke.sh
          bash test/web_media_smoke.sh
          bash test/mobile_api_smoke.sh
      - name: First-run and .deck smoke
        shell: bash
        run: |
          set -euo pipefail
          first_home=$(mktemp -d)
          HOME="$first_home" ./zig-out/bin/plandalf --help >/dev/null
          HOME="$first_home" ./zig-out/bin/plandalf decks </dev/null
          test -f "$first_home/.local/share/plandalf/plandalf.db"
          test ! -e "$first_home/.config/deez/config"
          test ! -e "$first_home/.config/plandalf/config"
          HOME="$first_home" ./zig-out/bin/plandalf deck add "Zig Basics"
          HOME="$first_home" ./zig-out/bin/plandalf card add 1 "What is SQLite?" "An embedded SQL database"
          HOME="$first_home" ./zig-out/bin/plandalf deck export 1 > /tmp/zig-basics.deck
          grep -q '"format":"plandalf.deck"' /tmp/zig-basics.deck
          second_home=$(mktemp -d)
          HOME="$second_home" ./zig-out/bin/plandalf deck import /tmp/zig-basics.deck </dev/null
          HOME="$second_home" ./zig-out/bin/plandalf decks | grep -q "Zig Basics"
          if HOME="$first_home" ./zig-out/bin/plandalf nut export 1 >/dev/null 2>&1; then
            echo 'removed nut command unexpectedly succeeded' >&2
            exit 1
          fi
          if HOME="$first_home" ./zig-out/bin/plandalf sack import old.sack >/dev/null 2>&1; then
            echo 'removed sack command unexpectedly succeeded' >&2
            exit 1
          fi
      - name: Test
        run: zig build test
      - name: Benchmark context
        run: |
          echo "commit=${GITHUB_SHA}"
          echo "zig=$(zig version)"
          uname -a
      - name: Benchmark smoke
        run: zig build benchmark -Doptimize=ReleaseFast

  macos-release-smoke:
    strategy:
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build native release binary
        run: zig build -Doptimize=ReleaseFast
      - name: Run release binary
        run: ./zig-out/bin/plandalf --help >/dev/null
